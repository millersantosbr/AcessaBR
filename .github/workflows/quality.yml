name: Qualidade

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "site/data/audits.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar site e dados
        run: npm test

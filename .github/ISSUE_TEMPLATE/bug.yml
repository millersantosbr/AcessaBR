name: Relatar problema no AcessaBR
description: Informe um erro no painel, coletor ou documentação.
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: O que aconteceu?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: O que deveria acontecer?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Navegador e dispositivo
  - type: checkboxes
    id: checks
    attributes:
      label: Verificações
      options:
        - label: Procurei por uma issue existente.
          required: true
        - label: Removi dados pessoais e informações sensíveis.
          required: true
